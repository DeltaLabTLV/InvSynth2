name: invsynth2
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.*
  - scipy=1.13.*
  - pandas=2.2.*
  - matplotlib=3.8.*
  - librosa=0.10.*
#  - soundfile==0.12.0
  - tqdm
  - pyyaml
  - jupyter
  - ipykernel
  # PyTorch with CUDA 12.1 (works on Windows)
  - pytorch=2.3.*
  - torchaudio=2.3.*
  - pytorch-cuda=12.1
  - pip:
      - lightning==2.3.*
      - tensorboard==2.16.*
      - hydra-core==1.3.*
      - omegaconf==2.3.*
      - torchmetrics==1.4.*
      - einops==0.8.*
      - pesq==0.0.4
      - pystoi==0.4.1
      - rich==13.7.*
      - scikit-learn==1.5.*
      - soundfile==0.13.0
