[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invsynth2"
version = "1.0.0"
description = "Drivers of Success in Synthesizer Inversion (ISMIR 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]

[tool.setuptools.packages.find]
where = ["src"]
